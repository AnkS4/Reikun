<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Reikun (例訓) — Semantic Japanese Dictionary</title>
		<meta name="description" content="Reikun (例訓) — semantic Japanese dictionary with JLPT-aware grammar explanations" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Reikun" />
		<meta property="og:title" content="Reikun (例訓) — Semantic Japanese Dictionary" />
		<meta
			property="og:description"
			content="Search English or Japanese, break down sentences word-by-word with furigana, inspect kanji, get grammar explanations tuned to your JLPT level."
		/>
		<meta property="og:url" content="https://reikun.app/" />
		<meta property="og:image" content="https://reikun.app/logo.png" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Reikun (例訓) — Semantic Japanese Dictionary" />
		<meta
			name="twitter:description"
			content="Search English or Japanese, break down sentences word-by-word with furigana, inspect kanji, get grammar explanations tuned to your JLPT level."
		/>
		<meta name="twitter:image" content="https://reikun.app/logo.png" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Reikun",
				"alternateName": "例訓",
				"url": "https://reikun.app/",
				"description": "Semantic Japanese dictionary — English/Japanese search, sentence breakdown with furigana, kanji details, JLPT-calibrated grammar explanations.",
				"applicationCategory": "ReferenceApplication",
				"operatingSystem": "Any"
			}
		</script>
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfaf6" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
		<link rel="icon" href="%sveltekit.assets%/logo.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply persisted theme before first paint to avoid a flash.
			(function () {
				var t = localStorage.getItem('reikun-theme') || 'system';
				if (t === 'amoled') t = 'oled'; // legacy value
				var resolved = t;
				if (t === 'system') {
					// NOTE: 'oled' is intentionally the default dark resolution for system preference (not 'dark').
					resolved = matchMedia('(prefers-color-scheme: dark)').matches ? 'oled' : 'light';
				}
				document.documentElement.dataset.theme = resolved;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
