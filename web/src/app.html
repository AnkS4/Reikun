<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Reikun (例訓) — Semantic Japanese Dictionary & Reading Assistant with JLPT-aware grammar explanations" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Reikun" />
		<meta property="og:title" content="Reikun (例訓) — Semantic Japanese Dictionary & Reading Assistant" />
		<meta
			property="og:description"
			content="Search English or Japanese words and sentences, break them down word-by-word, see meanings and furigana, inspect kanji, and get grammar explanations tuned to your JLPT level."
		/>
		<meta property="og:url" content="https://reikun.app/" />
		<meta property="og:image" content="https://reikun.app/images/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Reikun (例訓) — Semantic Japanese Dictionary & Reading Assistant" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Reikun (例訓) — Semantic Japanese Dictionary & Reading Assistant" />
		<meta
			name="twitter:description"
			content="Search English or Japanese words and sentences, break them down word-by-word, see meanings and furigana, inspect kanji, and get grammar explanations tuned to your JLPT level."
		/>
		<meta name="twitter:image" content="https://reikun.app/images/og-image.png" />
		<!-- Paired with the sha256-96O4ANVx5qN/vB/eYqW/7eBVA7RBWLIFsIwfLNI09Ak= hash in vite.config.ts — if you edit this block, re-compute the hash or crawlers stop seeing it. -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Reikun",
				"alternateName": "例訓",
				"url": "https://reikun.app/",
				"description": "Semantic Japanese Dictionary & Reading Assistant — English/Japanese search, sentence breakdown with furigana, kanji details, JLPT-calibrated grammar explanations.",
				"applicationCategory": "ReferenceApplication",
				"operatingSystem": "Any"
			}
		</script>
		<meta name="color-scheme" content="light dark" />
		<!-- One tag, kept current by the inline script below and theme.svelte.ts, so the
		     browser chrome matches the *chosen* theme, not just the OS setting. -->
		<meta name="theme-color" id="theme-color" content="#fcfaf6" />
		<!-- Favicons & Touch Icons: Prefer SVG for sharpness across DPRs, PNG fallbacks as backup -->
		<link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/favicons/favicon-48.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicons/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicons/favicon-16.png" />
		<link rel="icon" type="image/svg+xml" sizes="any" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<!-- Self-hosted fonts — IBM/plex upstream archives only, no
		     Google dependencies: tools/fetch-fonts.mjs mirrors them into
		     static/fonts/. Selection: IBM Plex Sans 400/500/600 (body and
		     display), IBM Plex Mono 400/500 (labels), IBM Plex Sans JP
		     400/500/600 (Japanese), IBM Plex Sans Devanagari 400/500/600
		     (Devanagari). unicode-range subsets keep downloads lazy per
		     script. Loaded without blocking first paint. -->
		<link rel="preload" href="%sveltekit.assets%/fonts/fonts.css" as="style" />
		<link
			href="%sveltekit.assets%/fonts/fonts.css"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link href="%sveltekit.assets%/fonts/fonts.css" rel="stylesheet" />
		</noscript>
		<script src="%sveltekit.assets%/theme-init.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
