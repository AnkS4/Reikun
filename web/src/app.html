<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Reikun (例訓) — semantic Japanese dictionary with JLPT-aware grammar explanations" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Reikun" />
		<meta property="og:title" content="Reikun (例訓) — Semantic Japanese Dictionary" />
		<meta
			property="og:description"
			content="Search English or Japanese, break down sentences word-by-word with furigana, inspect kanji, get grammar explanations tuned to your JLPT level."
		/>
		<meta property="og:url" content="https://reikun.app/" />
		<meta property="og:image" content="https://reikun.app/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Reikun (例訓) — semantic Japanese dictionary" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Reikun (例訓) — Semantic Japanese Dictionary" />
		<meta
			name="twitter:description"
			content="Search English or Japanese, break down sentences word-by-word with furigana, inspect kanji, get grammar explanations tuned to your JLPT level."
		/>
		<meta name="twitter:image" content="https://reikun.app/og-image.png" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Reikun",
				"alternateName": "例訓",
				"url": "https://reikun.app/",
				"description": "Semantic Japanese dictionary — English/Japanese search, sentence breakdown with furigana, kanji details, JLPT-calibrated grammar explanations.",
				"applicationCategory": "ReferenceApplication",
				"operatingSystem": "Any"
			}
		</script>
		<meta name="color-scheme" content="light dark" />
		<!-- One tag, kept current by the inline script below and theme.svelte.ts, so the
		     browser chrome matches the *chosen* theme, not just the OS setting. -->
		<meta name="theme-color" id="theme-color" content="#fcfaf6" />
		<link rel="icon" href="%sveltekit.assets%/logo.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Only the weights app.css uses (Space Grotesk 500, Inter 400/500/600,
		     JetBrains Mono 400/500, Noto Sans JP 400/500). Loaded without blocking
		     first paint: media=print until it arrives, then swapped to all. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap"
				rel="stylesheet"
			/>
		</noscript>
		<script>
			// Apply persisted theme before first paint to avoid a flash.
			(function () {
				var t = 'system';
				try {
					t = localStorage.getItem('reikun-theme') || 'system';
				} catch (_) {
					// Storage may be blocked; use the system theme for this visit.
				}
				if (t === 'amoled') t = 'oled'; // legacy value
				var resolved = t;
				if (t === 'system') {
					// NOTE: 'oled' is intentionally the default dark resolution for system preference (not 'dark').
					resolved = matchMedia('(prefers-color-scheme: dark)').matches ? 'oled' : 'light';
				}
				document.documentElement.dataset.theme = resolved;
				// Keep in sync with --bg in app.css and CHROME_COLOR in theme.svelte.ts.
				var bg = { light: '#fcfaf6', dark: '#0f1620', oled: '#000000' }[resolved] || '#fcfaf6';
				document.getElementById('theme-color')?.setAttribute('content', bg);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
