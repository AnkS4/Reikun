version: 2
updates:
  # Keep the SHA-pinned GitHub Actions in .github/workflows/ci.yml fresh:
  # Dependabot opens a PR bumping each pin when upstream tags a new release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Frontend deps (web/package-lock.json).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"

  # Python deps managed by uv (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
