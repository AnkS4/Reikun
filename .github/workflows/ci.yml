name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the checkout.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: uv sync --locked

      - run: uv run ruff check .

      # Everything in tests/ runs without Qdrant/Cohere — committed data
      # (kanji_table.json, headword_index.marisa, strokes.json) + validation
      # paths only.
      - run: uv run pytest -q

      - name: OpenAPI schema is up to date
        run: |
          uv run python scripts/dump_openapi.py
          git diff --exit-code docs/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # The committed types must match the committed schema — svelte-check
      # passes against stale types, so nothing else catches a forgotten
      # regeneration. The generator version is pinned inside `gen:api`
      # (package.json) — npx rather than a devDependency because
      # openapi-typescript@7 peer-depends on typescript@^5.
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/lib/openapi.d.ts
