name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the checkout.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - run: uv sync --locked

      - run: uv run ruff check .

      # Type gate: ty (Astral, pinned via uv.lock; pyproject says ty>=0.0.96 — it's a 0.0.x,
      # so version moves are deliberate). Scope and suppressions live in
      # [tool.ty] in pyproject.toml (app/ only; sub-second run).
      - run: uv run ty check app

      # Everything in tests/ runs without Qdrant/Groq — committed data
      # (kanji_table.json, headword_index.marisa, strokes.json) + validation
      # paths only.
      - run: uv run pytest -q

      # Shared SPA/Lite string tables: key + placeholder parity.
      - run: uv run python scripts/check_i18n.py

      # The font supply chain: a renamed non-WOFF2 payload shipped silently
      # before (see "every self-hosted font face was silently broken" in the
      # 1.4.0 changelog). Gate on the magic bytes and on lite's subset
      # icon font rebuilding byte-identically.
      - name: Self-hosted fonts are genuine WOFF2 + consistent with fonts.css
        run: |
          python3 - <<'EOF'
          import glob
          import re
          import sys

          files = glob.glob('web/static/fonts/files/*.woff2')
          bad = [f for f in files if open(f, 'rb').read(4) != b'wOF2']
          if bad:
              print('not WOFF2:', bad)
              sys.exit(1)
          css = open('web/static/fonts/fonts.css').read()
          urls = set(re.findall(r'url\((files/[^)]+)\)', css))
          on_disk = {'files/' + f.split('/')[-1] for f in files}
          if urls != on_disk:
              print('fonts.css ↔ files mismatch:', sorted(urls ^ on_disk))
              sys.exit(1)
          print(f'{len(files)} woff2 faces OK; css ↔ files consistent')
          EOF

      - name: Lite icon font rebuilds byte-identically
        run: |
          uv run --with skia-pathops==0.9.2 --with fonttools==4.68.0 --with brotli==1.2.1 \
            python scripts/build_lite_icons.py
          git diff --exit-code app/static/lite-icons.woff2

      - name: OpenAPI schema is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code docs/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # The committed types must match the committed schema — svelte-check
      # passes against stale types, so nothing else catches a forgotten
      # regeneration. The generator version is pinned inside `gen:api`
      # (package.json) — npx rather than a devDependency because
      # openapi-typescript@7 peer-depends on typescript@^5.
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/lib/openapi.d.ts
