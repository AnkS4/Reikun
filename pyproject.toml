[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reikun"
version = "0.5.0"
description = "Reikun (例訓) — Semantic Japanese Dictionary"
authors = [{ name = "Aniket Satbhai" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "qdrant-client==1.19.1",
    "fastembed==0.8.1",
    "groq==1.7.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "sudachipy==0.7.0",
    "sudachidict-small==20260723.1",
    "marisa-trie==1.4.1",
]

[project.scripts]
reikun = "scripts.startup:main"

[dependency-groups]
ingest = [
    "wordfreq==3.1.1",
]
dev = [
    { include-group = "ingest" },
    "watchfiles==1.2.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PERF", "RUF"]
