[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reikun"
version = "0.3.0"
description = "例訓 (れいくん) - Semantic Japanese Dictionary"
authors = [{ name = "Aniket Satbhai" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "qdrant-client==1.19.1",
    "fastembed==0.8.0",
    "cohere==7.1.1",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "fastapi==0.141.1",
    # Plain uvicorn, not [standard]: the container serves the API with one
    # worker, so the extra's uvloop/httptools/watchfiles/websockets would be
    # ~25 MB of unused image. The extra is in the dev group for
    # `uvicorn app.api:app --reload`.
    "uvicorn==0.53.0",
    # Japanese morphological analyzer for runtime sentence segmentation
    # (SplitMode.B word units) and build_chunks' wf_score token counts.
    # sudachidict-small (~110 MB unpacked vs ~200 MB for -core) covers the
    # deployment target; over-split compounds get re-merged by
    # retrieval._segment_sudachi's compound-rescue stage. Pinned exactly per
    # the upstream v0.8.* advisory; the dict format is paired to the
    # binding, so bump both together.
    "sudachipy==0.7.0",
    "sudachidict-small==20260723.1",
    "marisa-trie==1.4.1",
]

[project.scripts]
reikun = "scripts.startup:main"

# Ingest/build-time and local-dev only, never imported by the app at runtime.
# Kept out of the runtime dependencies so the Docker image stays leaner.
# uv sync/uv run install the default groups (dev + ui) — see [tool.uv].
#   wordfreq — scripts/build_chunks.py (the wf_score canonical-ranking prior);
#     its ja lookups are shimmed onto sudachipy (wordfreq.mecab shim).
#   uvicorn[standard] — only for running the API with --reload (needs
#     watchfiles); the container runs plain `uvicorn app.api:app`.
#   ui — the Streamlit app + dashboard (local dev only; the API image and the
#     SvelteKit frontend don't use them). pandas is dashboard-only too: the
#     telemetry sqlite sink needs nothing beyond stdlib sqlite3.
[dependency-groups]
dev = [
    "wordfreq==3.1.1",
    "uvicorn[standard]==0.53.0",
]
ui = [
    "streamlit==1.64.0",
    "pandas==3.0.6",
    "altair==6.3.0",
]

# Local workflows install everything (dev tooling + the Streamlit UI); the
# Docker build passes --no-default-groups (--group dev for ingest builds) to
# get a lean API-only environment.
[tool.uv]
default-groups = ["dev", "ui"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E/F/I: pyflakes + import order. UP: pyupgrade (keeps us on 3.13 idioms).
# B: bugbear, C4: comprehensions, PERF: performance, RUF: ruff-specific.
select = ["E", "F", "I", "UP", "B", "C4", "PERF", "RUF"]
ignore = [
    "E501",     # long lines: prose-heavy docstrings/comments are deliberate here
    # RUF001-003 flag "ambiguous" Unicode (full-width ／：（）, CJK punctuation).
    # This is a Japanese-language corpus — those characters are the domain, not typos.
    "RUF001",
    "RUF002",
    "RUF003",
    "B008",     # FastAPI's Depends()/Query() in argument defaults is the idiom
    # itertools.batched()'s final batch is intentionally short at ingest
    # (218,786 chunks is not a multiple of BATCH_SIZE), so strict=True is wrong.
    "B911",
    "C408",     # dict(a=…, b=…) reads better than a literal for kwargs-style params
    "PERF401",  # the explicit append loops are in one-off build/eval code, not hot paths
    # The `# noqa: E402` after each sys.path bootstrap is kept for flake8/
    # pycodestyle; ruff itself tolerates imports after sys.path.insert and so
    # reports the directive as redundant.
    "RUF100",
]

# Note: the script entrypoints need a sys.path bootstrap before importing
# `app`, and already carry explicit `# noqa: E402` on those lines — that is
# kept instead of a blanket per-file ignore so the exception stays visible.
