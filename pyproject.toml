[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reikun"
version = "1.2.0"
description = "Reikun (例訓) — Semantic Japanese Dictionary & Reading Assistant"
authors = [{ name = "Aniket Satbhai" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
    "qdrant-client==1.20.0",
    "fastembed==0.9.1",
    "openai==3.49.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "sudachipy==0.7.0",
    "sudachidict-small==20261015",
    "marisa-trie==1.4.1",
    "starlette==1.10.0",
]

[project.scripts]
reikun = "scripts.startup:main"

[dependency-groups]
ingest = [
    "wordfreq==3.1.1",
]
dev = [
    { include-group = "ingest" },
    "watchfiles==1.3.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "httpx2==2.16.0",
    "ty>=0.0.96",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ty]
# Primary type checker (Astral — same team as uv and ruff, installed in the
# dev group beside them). Diagnostic names match `ty check app`, so CI and a
# `ty` editor extension agree. Scope follows the serving half, as before:
# scripts/ is build-tooling over untyped XML/Tatoeba data and tests/ is
# exercised by pytest, not by a type checker.

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["app"]

[tool.ty.analysis]
# marisa-trie ships no type stubs, so the import is reported unresolved by
# every checker; it isn't fixable until upstream publishes py.typed. The
# module is exercised by tests, so real breakage still surfaces at runtime.
allowed-unresolved-imports = ["marisa_trie"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PERF", "RUF"]
