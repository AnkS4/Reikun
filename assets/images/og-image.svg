	<!-- Wordmark + kanji, inline like the homepage h1 (366px + 247px) -->
	<text x="370" y="310" font-family="'Space Grotesk', sans-serif" font-weight="500" font-size="118" letter-spacing="-3" fill="#19262C">Reikun<tspan x="736" font-family="'Noto Sans JP', sans-serif" font-weight="400" font-size="85" letter-spacing="0" fill="#665F56"> (例訓)</tspan></text>

