<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
	<!-- Reikun OG image — 1200×630 (Open Graph / Twitter card)
	     Brand lockup mirrors the homepage hero: the emblem sits inline with
	     "Reikun (例訓)" — "Reikun" in Space Grotesk 500, the kanji in Noto Sans
	     JP 400 at 0.72em in the muted ink, exactly as .hero-heading renders it —
	     the brand subtext rides the mono badge pill (.hero-badge-tag), and the
	     feature lines are centred beneath for a symmetric frame. Palette:
	     washi #FCFAF6 · charcoal #19262C · persimmon #EF3C19 ·
	     badge cream #EFECE1 · muted sumi #665F56 -->

	<rect width="1200" height="630" fill="#FCFAF6"/>

	<!-- Subtext badge (homepage .hero-badge-tag: mono, uppercase, cream pill) -->
	<rect x="162" y="142" width="876" height="48" rx="24" fill="#EFECE1"/>
	<text x="600" y="175" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="21" letter-spacing="4" fill="#665F56">SEMANTIC JAPANESE DICTIONARY &amp; READING ASSISTANT</text>

