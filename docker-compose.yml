name: reikun-app

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"   # loopback only — Qdrant has no auth
      - "127.0.0.1:6334:6334"   # gRPC (local ingest with prefer_grpc)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]   # no wget/curl in image
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      args:
        INGEST_VIA_DOCKER: ${INGEST_VIA_DOCKER:-0}
    image: reikun:latest
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_HOST: qdrant
    volumes:
      - ./data/processed:/app/data/processed
      - ./data/raw:/app/data/raw
      - ./data/kanjivg:/app/data/kanjivg
      - ./data/monitoring:/app/data/monitoring
      - models:/app/models   # named volume — seeds models baked into the image; bind mount would mask them
    depends_on:
      qdrant:
        condition: service_healthy
    restart: on-failure:3   # startup.py exits 1 on ingest failure; unless-stopped would retry forever

volumes:
  qdrant_data:
  models:
