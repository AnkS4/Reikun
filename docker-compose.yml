name: reikun-app

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"   # loopback only — Qdrant has no auth
      - "127.0.0.1:6334:6334"   # gRPC (local ingest with prefer_grpc)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]   # no wget/curl in image
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
    image: reikun:latest
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_HOST: qdrant
      # Origin of the web UI, for the lite page's variant-switch link (the two
      # variants run on different published ports in development).
      WEB_BASE_URL: http://127.0.0.1:5173
      # Runtime only — not baked into the image. Default off; enable with
      # `INGEST_VIA_DOCKER=1 docker compose up -d --build` (do not put this in .env).
      INGEST_VIA_DOCKER: ${INGEST_VIA_DOCKER:-0}
    volumes:
      - ./data/processed:/app/data/processed
      - ./data/raw:/app/data/raw
      - ./data/monitoring:/app/data/monitoring
      - models:/app/models   # named volume — seeds models baked into the image; bind mount would mask them
    depends_on:
      qdrant:
        condition: service_healthy
    restart: on-failure:3   # startup.py exits 1 on ingest failure; unless-stopped would retry forever

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      # Build-time arg: PUBLIC_API_BASE=/api bakes same-origin requests —
      # the browser's /api calls hit the vite preview server, which proxies
      # them to the app container (VITE_API_PROXY_TARGET below). Same shape
      # as production, where the Cloudflare Worker proxies /api to Cloud Run.
      args:
        # Same-origin /api (and /lite) via the preview proxy in vite.config.ts —
        # the same shape as production (Worker proxy). VITE_API_PROXY_TARGET
        # moves the upstream if the API port is remapped.
        PUBLIC_API_BASE: /api
    image: reikun-web:latest
    environment:
      # The preview proxy runs inside this container: point it at the app
      # service over the container network, not at 127.0.0.1.
      VITE_API_PROXY_TARGET: http://app:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  qdrant_data:
  models:
