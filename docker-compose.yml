name: reikun-app

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    # Bound to loopback: Qdrant has no auth by default, so these must not be
    # reachable from the LAN. The app talks to it over the internal compose
    # network (QDRANT_HOST=qdrant), not through these host mappings.
    ports:
      - "127.0.0.1:6333:6333"   # REST / HTTP (what the app + dashboard use)
      - "127.0.0.1:6334:6334"   # gRPC (unused by the app; for local ingest with prefer_grpc)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    restart: unless-stopped
    healthcheck:
      # wget/curl are absent from the qdrant image; a TCP connect to the REST
      # port is enough — Qdrant only listens once it is ready to serve.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    # One knob for ingestion: INGEST_VIA_DOCKER=1 in .env or the shell
    # reaches the build here (rsync + dev deps) and the container env via
    # env_file/baked ENV —
    #     INGEST_VIA_DOCKER=1 docker compose up -d --build
    build:
      context: .
      args:
        INGEST_VIA_DOCKER: ${INGEST_VIA_DOCKER:-0}
    image: reikun:latest
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8501"
    # Only QDRANT_HOST differs from the defaults in app/config.py, so it is the
    # only value hardcoded here; everything else (COHERE_API_KEY, EMBED_MODEL,
    # QUERY_REWRITE, QDRANT_*) is read from .env when present, and otherwise
    # falls back to those same defaults.
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_HOST: qdrant
    volumes:
      - ./data/processed:/app/data/processed
      - ./data/raw:/app/data/raw
      - ./data/kanjivg:/app/data/kanjivg
      - ./data/monitoring:/app/data/monitoring
      # Named volume, not a bind mount: named volumes seed from the image on
      # first creation, so the ONNX models pre-warmed in the Dockerfile are
      # actually used. A bind mount would mask them and force a re-download.
      - models:/app/models
    # The app serves the Streamlit UI and the HTTP API in one process:
    # UI at /, API + Swagger docs under /api (see app/asgi_app.py).
    depends_on:
      qdrant:
        condition: service_healthy
    # on-failure, not unless-stopped: scripts/startup.py exits 1 when the
    # ingest pipeline fails, and unless-stopped would retry that forever,
    # re-downloading JMdict on every attempt.
    restart: on-failure:3

volumes:
  qdrant_data:
  models:
